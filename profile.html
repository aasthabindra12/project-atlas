<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aastha Bindra | Project Atlas Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      color: #1e293b;
    }

    .profile-card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.10);
    }

    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #4f46e5;
      color: #ffffff;
      font-size: 30px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.7rem;
    }

    .role {
      margin: 0 0 18px;
      color: #4f46e5;
      font-weight: 600;
    }

    .intro {
      margin: 0 0 24px;
      color: #475569;
      line-height: 1.6;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 0 0 26px;
      padding: 0;
      list-style: none;
    }

    .skills li {
      padding: 8px 12px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .profile-link {
      display: inline-block;
      padding: 11px 18px;
      border-radius: 10px;
      background: #4f46e5;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }

    .profile-link:hover,
    .profile-link:focus-visible {
      background: #3730a3;
      outline: 3px solid #c7d2fe;
      outline-offset: 3px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

<body>
  <main>
    <article class="profile-card" aria-labelledby="profile-name">

      <div class="avatar" aria-hidden="true">AB</div>

      <header>
        <h1 id="profile-name">Aastha Bindra</h1>
        <p class="role">B.Tech Computer Science Student</p>
      </header>

      <section aria-labelledby="about-heading">
        <h2 id="about-heading" class="visually-hidden">About me</h2>
        <p class="intro">
          I’m a computer science student from Punjab who enjoys learning new
          technologies, solving problems, and building creative projects.
        </p>
      </section>

      <section aria-labelledby="skills-heading">
        <h2 id="skills-heading">Skills</h2>

        <ul class="skills">
          <li>HTML</li>
          <li>CSS</li>
          <li>Python</li>
        </ul>
      </section>

      <footer>
        <a
          class="profile-link"
          href="https://github.com/aasthabindra12"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit Aastha Bindra's GitHub profile"
        >
          View GitHub Profile
        </a>
      </footer>

    </article>
  </main>
</body>
</html>
